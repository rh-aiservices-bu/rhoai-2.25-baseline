---
# The RHOAI 2.25.10 Subscription uses installPlanApproval=Manual + startingCSV=2.25.10
# to pin the channel at the pre-migration version. The bash install approves the
# initial InstallPlan with approve_installplan(); Argo CD needs to do the same.
#
# History note: this Job was originally a PostSync hook on the RHOAI Application.
# That deadlocks — the Subscription's health check reports Healthy only after the
# CSV is Succeeded, and the CSV can't become Succeeded until the InstallPlan is
# approved. Argo CD only fires PostSync hooks after the Application is Synced AND
# Healthy, so the Job never runs. Fixed by making this a plain resource in its
# own Application (rhoai-2254-installplan-approver, sync-wave 6) which syncs
# independently. The Job polls for the InstallPlan and approves it as soon as OLM
# creates it. Idempotent; safe to re-run.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: installplan-approver
  namespace: redhat-ods-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: installplan-approver
  namespace: redhat-ods-operator
rules:
  - apiGroups: ["operators.coreos.com"]
    resources: ["installplans"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # The Job reconciles until TARGET_CSV reports Succeeded, so it must read CSVs.
  - apiGroups: ["operators.coreos.com"]
    resources: ["clusterserviceversions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: installplan-approver
  namespace: redhat-ods-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: installplan-approver
subjects:
  - kind: ServiceAccount
    name: installplan-approver
    namespace: redhat-ods-operator
---
apiVersion: batch/v1
kind: Job
metadata:
  name: approve-rhoai-installplan
  namespace: redhat-ods-operator
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: installplan-approver
      restartPolicy: OnFailure
      containers:
        - name: approve
          image: registry.redhat.io/openshift4/ose-cli:latest
          env:
            - name: NAMESPACE
              value: "redhat-ods-operator"
            # The only CSV this Job will ever approve. Keep in step with
            # startingCSV in 10-operators/rhoai-operator.yaml.
            - name: TARGET_CSV
              value: "rhods-operator.2.25.10"
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # Reconcile until TARGET_CSV is actually installed, rather than
              # making a single pass. Two reasons a one-shot pass is not enough:
              #
              #  1. Race. OLM creates the InstallPlan object a moment before it
              #     populates spec.approved. A single pass that breaks as soon as
              #     an InstallPlan *exists* can then match nothing, print "done",
              #     and exit 0 having approved nothing — and because it exited 0,
              #     restartPolicy/backoffLimit never retry it.
              #  2. Ordering. Any later InstallPlan (notably the 2.25.11 z-stream
              #     upgrade OLM offers once 2.25.10 reaches Succeeded) is created
              #     long after a one-shot Job has exited and its TTL removed it.
              #
              # Looping until the CSV reports Succeeded closes the race, and
              # exiting non-zero on timeout lets backoffLimit retry instead of
              # failing silently.
              deadline=$(( SECONDS + 900 ))
              while (( SECONDS < deadline )); do
                phase=$(oc get csv -n "$NAMESPACE" "$TARGET_CSV" \
                  -o jsonpath='{.status.phase}' 2>/dev/null || true)
                if [[ "$phase" == "Succeeded" ]]; then
                  echo "CSV ${TARGET_CSV} is Succeeded — nothing left to approve"
                  exit 0
                fi

                # Approve a plan only when EVERY CSV it would install is the
                # pinned target. A "contains TARGET_CSV" test is not enough: a
                # plan listing both the old and the new CSV would pass it and
                # roll us straight off the pin. Requiring the whole list to be
                # exactly TARGET_CSV is what keeps this baseline at 2.25.10
                # instead of advancing to the channel head.
                for plan in $(oc get installplan -n "$NAMESPACE" \
                    -o jsonpath='{range .items[?(@.spec.approved==false)]}{.metadata.name}{"\n"}{end}'); do
                  csvs=$(oc get installplan -n "$NAMESPACE" "$plan" \
                    -o jsonpath='{range .spec.clusterServiceVersionNames[*]}{@}{"\n"}{end}' | sed '/^$/d')
                  unexpected=$(grep -vx "$TARGET_CSV" <<<"$csvs" || true)
                  if [[ -n "$csvs" && -z "$unexpected" ]]; then
                    echo "approving InstallPlan/${plan} (${TARGET_CSV})"
                    oc patch installplan -n "$NAMESPACE" "$plan" \
                      --type=merge -p '{"spec":{"approved":true}}'
                  else
                    echo "leaving InstallPlan/${plan} unapproved (CSVs: $(tr '\n' ' ' <<<"$csvs")) — pinned to ${TARGET_CSV}"
                  fi
                done
                sleep 10
              done

              echo "ERROR: ${TARGET_CSV} did not reach Succeeded within 15m" >&2
              oc get installplan -n "$NAMESPACE" >&2 || true
              exit 1
