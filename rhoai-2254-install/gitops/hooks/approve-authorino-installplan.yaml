---
# Approves only the InstallPlan for authorino-operator.v1.2.4 in openshift-operators.
# Later InstallPlans for v1.3.x / v1.4.x (which drop the authorino.kuadrant.io/v1beta2
# API that RHOAI 2.25.x odh-model-controller hardcodes) stay pending, so an accidental
# channel-head advance can't silently break every ISVC's auth.
#
# Separate from approve-installplan.yaml (which targets redhat-ods-operator) because
# openshift-operators hosts many Subscriptions and a wildcard approver here would
# happily approve *any* future upgrade plan for *any* operator sharing the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authorino-installplan-approver
  namespace: openshift-operators
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authorino-installplan-approver
  namespace: openshift-operators
rules:
  - apiGroups: ["operators.coreos.com"]
    resources: ["installplans"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # The Job reconciles until TARGET_CSV reports Succeeded, so it must read CSVs.
  - apiGroups: ["operators.coreos.com"]
    resources: ["clusterserviceversions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authorino-installplan-approver
  namespace: openshift-operators
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authorino-installplan-approver
subjects:
  - kind: ServiceAccount
    name: authorino-installplan-approver
    namespace: openshift-operators
---
apiVersion: batch/v1
kind: Job
metadata:
  name: approve-authorino-installplan
  namespace: openshift-operators
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: authorino-installplan-approver
      restartPolicy: OnFailure
      containers:
        - name: approve
          image: registry.redhat.io/openshift4/ose-cli:latest
          env:
            - name: TARGET_CSV
              value: "authorino-operator.v1.2.4"
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # Reconcile until TARGET_CSV is actually installed, rather than
              # making a single pass. OLM creates the InstallPlan object a moment
              # before it populates spec.approved, so a one-shot pass that breaks
              # as soon as an InstallPlan *exists* can match nothing, print
              # "done", and exit 0 having approved nothing — and because it exited
              # 0, restartPolicy/backoffLimit never retry it. Looping until the
              # CSV reports Succeeded closes that race; exiting non-zero on
              # timeout lets backoffLimit retry instead of failing silently.
              deadline=$(( SECONDS + 900 ))
              while (( SECONDS < deadline )); do
                phase=$(oc get csv -n openshift-operators "$TARGET_CSV" \
                  -o jsonpath='{.status.phase}' 2>/dev/null || true)
                if [[ "$phase" == "Succeeded" ]]; then
                  echo "CSV ${TARGET_CSV} is Succeeded — nothing left to approve"
                  exit 0
                fi

                # Approve a plan only when EVERY CSV it would install is the
                # pinned target. A "contains TARGET_CSV" test is not enough: a
                # plan listing both the old and the new CSV would pass it. Any
                # other pending plan (v1.3.x/v1.4.x upgrades, which drop the
                # authorino.kuadrant.io/v1beta2 that RHOAI 2.25.x needs, or plans
                # for the unrelated Automatic operators that share this namespace)
                # is deliberately left alone.
                for plan in $(oc get installplan -n openshift-operators \
                    -o jsonpath='{range .items[?(@.spec.approved==false)]}{.metadata.name}{"\n"}{end}'); do
                  csvs=$(oc get installplan -n openshift-operators "$plan" \
                    -o jsonpath='{range .spec.clusterServiceVersionNames[*]}{@}{"\n"}{end}' | sed '/^$/d')
                  unexpected=$(grep -vx "$TARGET_CSV" <<<"$csvs" || true)
                  if [[ -n "$csvs" && -z "$unexpected" ]]; then
                    echo "approving InstallPlan/${plan} (${TARGET_CSV})"
                    oc patch installplan -n openshift-operators "$plan" \
                      --type=merge -p '{"spec":{"approved":true}}'
                  else
                    echo "leaving InstallPlan/${plan} unapproved (CSVs: $(tr '\n' ' ' <<<"$csvs")) — pinned to ${TARGET_CSV}"
                  fi
                done
                sleep 10
              done

              echo "ERROR: ${TARGET_CSV} did not reach Succeeded within 15m" >&2
              oc get installplan -n openshift-operators >&2 || true
              exit 1
