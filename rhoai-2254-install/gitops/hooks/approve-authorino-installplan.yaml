---
# Approves only the InstallPlan for authorino-operator.v1.2.4 in openshift-operators.
# Later InstallPlans for v1.3.x / v1.4.x (which drop the authorino.kuadrant.io/v1beta2
# API that RHOAI 2.25.x odh-model-controller hardcodes) stay pending, so an accidental
# channel-head advance can't silently break every ISVC's auth.
#
# Separate from approve-installplan.yaml (which targets redhat-ods-operator) because
# openshift-operators hosts many Subscriptions and a wildcard approver here would
# happily approve *any* future upgrade plan for *any* operator sharing the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authorino-installplan-approver
  namespace: openshift-operators
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authorino-installplan-approver
  namespace: openshift-operators
rules:
  - apiGroups: ["operators.coreos.com"]
    resources: ["installplans"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # The Job reconciles until TARGET_CSV reports Succeeded, so it must read CSVs.
  - apiGroups: ["operators.coreos.com"]
    resources: ["clusterserviceversions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authorino-installplan-approver
  namespace: openshift-operators
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authorino-installplan-approver
subjects:
  - kind: ServiceAccount
    name: authorino-installplan-approver
    namespace: openshift-operators
---
apiVersion: batch/v1
kind: Job
metadata:
  name: approve-authorino-installplan
  namespace: openshift-operators
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: authorino-installplan-approver
      restartPolicy: OnFailure
      containers:
        - name: approve
          # Pull `oc` from the cluster's own release payload via the internal
          # registry, not registry.redhat.io/openshift4/ose-cli:latest — that
          # repo publishes no `latest` tag, so the pull fails with "This
          # repository does not use the 'latest' tag" and the Job never starts
          # (ImagePullBackOff), silently leaving the InstallPlan unapproved.
          # The openshift/cli ImageStream is always present, always matches the
          # cluster's OCP version, and needs no registry entitlement. If the
          # internal registry is disabled, substitute an explicit external tag
          # such as registry.redhat.io/openshift4/ose-cli:v4.21.
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          env:
            - name: TARGET_CSV
              value: "authorino-operator.v1.2.4"
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # Reconcile until TARGET_CSV is actually installed, rather than
              # making a single pass. OLM creates the InstallPlan object a moment
              # before it populates spec.approved, so a one-shot pass that breaks
              # as soon as an InstallPlan *exists* can match nothing, print
              # "done", and exit 0 having approved nothing — and because it exited
              # 0, restartPolicy/backoffLimit never retry it. Looping until the
              # CSV reports Succeeded closes that race; exiting non-zero on
              # timeout lets backoffLimit retry instead of failing silently.
              # Package name, e.g. authorino-operator — used to spot a plan that
              # would move THIS operator to a version other than the pin.
              PKG="${TARGET_CSV%%.*}"
              deadline=$(( SECONDS + 900 ))
              while (( SECONDS < deadline )); do
                phase=$(oc get csv -n openshift-operators "$TARGET_CSV" \
                  -o jsonpath='{.status.phase}' 2>/dev/null || true)
                if [[ "$phase" == "Succeeded" ]]; then
                  echo "CSV ${TARGET_CSV} is Succeeded — nothing left to approve"
                  exit 0
                fi

                # Approve a plan only if it installs the pinned CSV and does not
                # ALSO carry a different version of this same operator.
                #
                # Co-resolved CSVs from *other* packages must be allowed. OLM
                # batches everything it resolves in a namespace into a single
                # InstallPlan, and openshift-operators hosts several Automatic
                # Subscriptions, so the pinned Authorino plan legitimately
                # arrives bundled with them — observed on a fresh cluster:
                #   kiali-operator.v2.27.4,servicemeshoperator.v2.6.17,authorino-operator.v1.2.4
                # Demanding that every CSV equal TARGET_CSV would reject that
                # forever and leave Authorino uninstalled. What must never be
                # approved is a plan carrying another version of THIS operator —
                # v1.3.x/v1.4.x drop the authorino.kuadrant.io/v1beta2 API that
                # RHOAI 2.25.x odh-model-controller hardcodes.
                for plan in $(oc get installplan -n openshift-operators \
                    -o jsonpath='{range .items[?(@.spec.approved==false)]}{.metadata.name}{"\n"}{end}'); do
                  csvs=$(oc get installplan -n openshift-operators "$plan" \
                    -o jsonpath='{range .spec.clusterServiceVersionNames[*]}{@}{"\n"}{end}' | sed '/^$/d')
                  if ! grep -qx "$TARGET_CSV" <<<"$csvs"; then
                    echo "leaving InstallPlan/${plan} unapproved (CSVs: $(tr '\n' ' ' <<<"$csvs")) — does not install ${TARGET_CSV}"
                    continue
                  fi
                  drift=$(grep "^${PKG}\." <<<"$csvs" | grep -vx "$TARGET_CSV" || true)
                  if [[ -n "$drift" ]]; then
                    echo "leaving InstallPlan/${plan} unapproved — would also move ${PKG} to: $(tr '\n' ' ' <<<"$drift")"
                    continue
                  fi
                  echo "approving InstallPlan/${plan} (CSVs: $(tr '\n' ' ' <<<"$csvs"))"
                  oc patch installplan -n openshift-operators "$plan" \
                    --type=merge -p '{"spec":{"approved":true}}'
                done
                sleep 10
              done

              echo "ERROR: ${TARGET_CSV} did not reach Succeeded within 15m" >&2
              oc get installplan -n openshift-operators >&2 || true
              exit 1
