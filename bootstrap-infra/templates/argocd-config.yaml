---
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  kustomizeBuildOptions: "--load-restrictor=LoadRestrictionsNone"
  # Default operator memory limit for the application-controller is 2Gi.
  # Under the 30-sample-* retry policy (retry.limit: 60, backoff.maxDuration:
  # 2m — see rhoai-2254-install/gitops/apps/30-sample-*.yaml) the controller's
  # working set — active Applications + rendered manifests + concurrent apply
  # attempts — comfortably exceeds 2Gi across the ~20 Applications this install
  # creates. Observed peak on a fresh install: ~1.7 GiB steady-state, spiking
  # during initial sync. Leaving the default in place causes recurring OOMKills
  # every ~20s during bootstrap, leaving some resources half-applied
  # (Namespaces + PVCs land, ISVCs don't). Bumping the limit to 6Gi eliminates
  # the OOM without needing to soften the retry policy that the CRD-race
  # workaround depends on.
  controller:
    resources:
      limits:
        cpu: "2"
        memory: "6Gi"
      requests:
        cpu: "250m"
        memory: "1Gi"
  # RHOAI is pinned at 2.25.10 (and Authorino at v1.2.4) via
  # installPlanApproval=Manual + startingCSV. Once the pinned CSV installs, OLM
  # permanently offers a newer InstallPlan — rhods-operator.2.25.11 as of the
  # current stable-2.25 head — that we deliberately never approve. That refusal
  # *is* the pin, and it parks the Subscription on
  # InstallPlanPending/RequiresApproval forever.
  #
  # Argo CD's built-in Subscription health check reports that as Progressing, so
  # rhoai-2254-operator-rhoai would never go Healthy and the root app-of-apps
  # would stall at sync-wave 5 — never reaching the approver Job (wave 6), the
  # DSC (wave 10) or the samples (wave 20). This override treats a
  # deliberately-unapproved plan as Healthy, while still failing loudly on the
  # conditions that mean the Subscription is genuinely broken.
  resourceHealthChecks:
    - group: operators.coreos.com
      kind: Subscription
      check: |
        hs = {}
        hs.status = "Healthy"
        hs.message = ""
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for _, condition in pairs(obj.status.conditions) do
            if condition.status == "True" then
              if condition.type == "CatalogSourcesUnhealthy"
                 or condition.type == "InstallPlanMissing"
                 or condition.type == "InstallPlanFailed"
                 or condition.type == "ResolutionFailed" then
                hs.status = "Degraded"
                hs.message = condition.type .. ": " .. (condition.message or "")
                return hs
              end
              if condition.type == "InstallPlanPending" then
                if condition.reason == "RequiresApproval" then
                  hs.status = "Healthy"
                  hs.message = "pinned: newer InstallPlan left unapproved by design"
                  return hs
                end
                hs.status = "Progressing"
                hs.message = "InstallPlanPending: " .. (condition.reason or "")
                return hs
              end
            end
          end
        end
        return hs
